---
- name: Deploy experiment-monitor
  tags: [ create ]
  block:
    - name: Create service account for experiment-monitor
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('ansible.builtin.file', 'experiment-monitor/experiment-monitor-role.yaml') | from_yaml_all }}"
    - name: Create PVC for experiment-monitor
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('ansible.builtin.file', 'experiment-monitor/experiments-pvc.yaml') | from_yaml }}"
    - name: Look for existing MQTT credentials
      kubernetes.core.k8s_info:
        kind: Secret
        name: mqtt-credentials
        namespace: experiment-monitor
      register: mqtt_credentials
    - name: Generate MQTT credentials
      when: mqtt_credentials.resources | length == 0
      no_log: true
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          type: Opaque
          metadata:
            name: mqtt-credentials
            namespace: experiment-monitor
          stringData:
            monitor-password: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=32) }}"
            scalehub-password: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=32) }}"
    - name: Deploy configmaps for mqtt-broker
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('ansible.builtin.file', 'experiment-monitor/mqtt-configmaps.yaml') | from_yaml }}"
    - name: Deploy mqtt-broker
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('ansible.builtin.file', 'experiment-monitor/mqtt-broker.yaml') | from_yaml_all }}"
    - name: Deploy experiment-monitor
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('ansible.builtin.file', 'experiment-monitor/experiment-monitor-deployment.yaml') | from_yaml }}"
- name: Delete experiment-monitor
  tags: [ delete ]
  block:
    - name: Delete experiment-monitor
      kubernetes.core.k8s:
        state: absent
        definition: "{{ lookup('ansible.builtin.file', 'experiment-monitor/experiment-monitor-deployment.yaml') | from_yaml }}"
    - name: Delete mqtt-broker
      kubernetes.core.k8s:
        state: absent
        definition: "{{ lookup('ansible.builtin.file', 'experiment-monitor/mqtt-broker.yaml') | from_yaml_all }}"
    - name: Delete configmaps for mqtt-broker
      kubernetes.core.k8s:
        state: absent
        definition: "{{ lookup('ansible.builtin.file', 'experiment-monitor/mqtt-configmaps.yaml') | from_yaml }}"
    - name: Delete ServiceAccount for experiment-monitor
      kubernetes.core.k8s:
        state: absent
        definition: "{{ lookup('ansible.builtin.file', 'experiment-monitor/experiment-monitor-role.yaml') | from_yaml_all }}"
    - name: Delete MQTT credentials
      kubernetes.core.k8s:
        state: absent
        kind: Secret
        name: mqtt-credentials
        namespace: experiment-monitor
