---
apiVersion: v1
kind: Service
metadata:
  name: mqtt-broker
  namespace: experiment-monitor
  labels:
    app: mqtt-broker
spec:
  type: NodePort
  ipFamilyPolicy: PreferDualStack
  ports:
      - port: 1883
        targetPort: 1883
        nodePort: 30001
        name: mqtt
  selector:
      app: mqtt-broker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-broker
  namespace: experiment-monitor
  labels:
      app: mqtt-broker
spec:
  selector:
    matchLabels:
      app: mqtt-broker
  template:
    metadata:
      name: mqtt-broker
      labels:
          app: mqtt-broker
    spec:
      nodeSelector:
          node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      initContainers:
        # Build mosquitto's password file from the generated credentials
        - name: mqtt-passwd
          image: eclipse-mosquitto:2.0.11
          command:
            - sh
            - -c
            - |
              mosquitto_passwd -c -b /work/passwd monitor "$MONITOR_PASSWORD"
              mosquitto_passwd -b /work/passwd scalehub "$SCALEHUB_PASSWORD"
              chown mosquitto:mosquitto /work/passwd
              chmod 0600 /work/passwd
          env:
            - name: MONITOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mqtt-credentials
                  key: monitor-password
            - name: SCALEHUB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mqtt-credentials
                  key: scalehub-password
          volumeMounts:
            - mountPath: /work
              name: mosquitto-passwd
      containers:
        - name: mqtt-broker
          image: eclipse-mosquitto:2.0.11
          imagePullPolicy: Always
          ports:
            - containerPort: 1883
              name: mqtt
          volumeMounts:
            - mountPath: /mosquitto/config/mosquitto.conf
              name: mosquitto-configmaps
              subPath: mosquitto.conf
            - mountPath: /mosquitto/config/acl
              name: mosquitto-configmaps
              subPath: acl
            - mountPath: /mosquitto/config/passwd
              name: mosquitto-passwd
              subPath: passwd
          command:
            -  /usr/sbin/mosquitto
            - -c
            - /mosquitto/config/mosquitto.conf
      volumes:
        - name: mosquitto-configmaps
          configMap:
            name: mosquitto-configmaps
            items:
              - key: mosquitto.conf
                path: mosquitto.conf
              - key: acl
                path: acl
        - name: mosquitto-passwd
          emptyDir: {}
