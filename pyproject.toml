[project]
name = "scalehub"
version = "1.0.0"
description = "Provision heterogeneous K3s clusters on Grid'5000 and edge devices to run Apache Flink scalability experiments"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Khaled Arsalane", email = "contact@khaled.ovh" }
]
keywords = ["kubernetes", "k3s", "ansible", "flink", "kafka", "stream-processing", "grid5000"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Clustering",
]
# The code runs inside the scalehub and monitor containers. Their dependencies are pinned in
# setup/scalehub/requirements.txt and setup/monitor/requirements.txt.
requires-python = ">=3.10"

[project.urls]
Repository = "https://github.com/ark-sys/scalehub"
Documentation = "https://github.com/ark-sys/scalehub/tree/main/docs"

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
